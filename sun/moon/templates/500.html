{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Внутренняя ошибка | СТО</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            background: #111; color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .error-card { text-align: center; max-width: 560px; }
        .error-card__logo { max-width: 110px; margin-bottom: 24px; }
        .error-card__code {
            font-size: 120px; font-weight: 900; color: #FF9900;
            line-height: 1; margin: 0 0 8px;
        }
        .error-card__title { font-size: 28px; margin: 0 0 16px; }
        .error-card__text {
            font-size: 16px; color: #bbb; margin: 0 0 32px; line-height: 1.5;
        }
        .error-card__actions {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
        }
        .error-btn {
            display: inline-block; padding: 14px 28px;
            background: #FF9900; color: #111; text-decoration: none;
            font-weight: 700; border-radius: 8px;
            transition: background .2s;
        }
        .error-btn:hover { background: #ffad33; }
        .error-btn--outline {
            background: transparent; color: #FF9900;
            border: 2px solid #FF9900;
        }
        .error-btn--outline:hover { background: #FF9900; color: #111; }
    </style>
</head>
<body>
    <div class="error-card">
        <img src="{% static 'img/logo.png' %}" alt="СТО" class="error-card__logo">
        <p class="error-card__code">500</p>
        <h1 class="error-card__title">Внутренняя ошибка сервера</h1>
        <p class="error-card__text">
            Что-то пошло не так на нашей стороне.
            Мы уже получили уведомление и работаем над исправлением.
            Пожалуйста, попробуйте позже.
        </p>
        <div class="error-card__actions">
            <a href="/" class="error-btn">На главную</a>
            <a href="/uslugi/" class="error-btn error-btn--outline"К поиску услуг</a>
        </div>
    </div>
</body>
</html>
